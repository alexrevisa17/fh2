        <!DOCTYPE html>
        <html lang="id">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>License Invalid - Faphouse Player</title>

            <style>
                * {
                    box-sizing: border-box;
                    -webkit-tap-highlight-color: transparent;
                }

                html, body {
                    margin: 0;
                    padding: 0;
                    width: 100%;
                    min-height: 100%;
                    font-family: Arial, Helvetica, sans-serif;
                    background: #08090d;
                    color: #fff;
                }

                body {
                    min-height: 100vh;
                    min-height: 100dvh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 24px 16px;
                    position: relative;
                    overflow-x: hidden;
                }

                body::before {
                    content: "";
                    position: fixed;
                    width: 420px;
                    height: 420px;
                    background: rgba(0, 255, 140, 0.08);
                    filter: blur(100px);
                    border-radius: 50%;
                    top: -180px;
                    left: -160px;
                    pointer-events: none;
                }

                body::after {
                    content: "";
                    position: fixed;
                    width: 380px;
                    height: 380px;
                    background: rgba(80, 100, 255, 0.07);
                    filter: blur(100px);
                    border-radius: 50%;
                    bottom: -180px;
                    right: -140px;
                    pointer-events: none;
                }

                .container {
                    width: 100%;
                    max-width: 430px;
                    position: relative;
                    z-index: 2;
                }

                .box {
                    width: 100%;
                    background: rgba(22, 24, 31, 0.94);
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 24px;
                    padding: 30px 26px 25px;
                    text-align: center;
                    box-shadow:
                        0 25px 70px rgba(0,0,0,0.55),
                        inset 0 1px 0 rgba(255,255,255,0.04);
                    backdrop-filter: blur(18px);
                    -webkit-backdrop-filter: blur(18px);
                }

                .logo {
                    width: 76px;
                    height: 76px;
                    margin: 0 auto 18px;
                    border-radius: 22px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 38px;
                    background: linear-gradient(
                        145deg,
                        #1ed760,
                        #0aa85a
                    );
                    box-shadow:
                        0 12px 30px rgba(30,215,96,0.22),
                        inset 0 1px 0 rgba(255,255,255,0.25);
                }

                h1 {
                    margin: 0;
                    font-size: 25px;
                    line-height: 1.2;
                    font-weight: 800;
                    letter-spacing: 1.5px;
                }

                .subtitle {
                    margin: 9px 0 0;
                    color: #9297a5;
                    font-size: 14px;
                    line-height: 1.5;
                }

                .brand {
                    margin: 12px 0 0;
                    color: #45e58a;
                    font-size: 12px;
                    letter-spacing: 0.4px;
                }

                .divider {
                    height: 1px;
                    border: 0;
                    background: linear-gradient(
                        90deg,
                        transparent,
                        rgba(255,255,255,0.1),
                        transparent
                    );
                    margin: 25px 0;
                }

                .error {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    text-align: left;
                    padding: 13px 14px;
                    border-radius: 12px;
                    background: rgba(255, 70, 70, 0.08);
                    border: 1px solid rgba(255, 70, 70, 0.18);
                    color: #ff7777;
                    font-size: 13px;
                    margin-bottom: 20px;
                }

                .label {
                    display: block;
                    text-align: left;
                    margin-bottom: 9px;
                    color: #dfe2e8;
                    font-size: 13px;
                    font-weight: 700;
                }

                .input-wrapper {
                    position: relative;
                    width: 100%;
                }

                .input-icon {
                    position: absolute;
                    left: 15px;
                    top: 50%;
                    transform: translateY(-50%);
                    font-size: 17px;
                    pointer-events: none;
                    opacity: 0.7;
                }

                input {
                    display: block;
                    width: 100%;
                    height: 52px;
                    padding: 0 15px 0 45px;
                    border-radius: 13px;
                    border: 1px solid #343842;
                    outline: none;
                    background: #101217;
                    color: #fff;
                    font-family: inherit;
                    font-size: 16px;
                    font-weight: 500;
                    letter-spacing: 0.5px;
                    transition:
                        border-color 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.2s ease;
                    -webkit-appearance: none;
                    appearance: none;
                }

                input::placeholder {
                    color: #666b76;
                    font-size: 14px;
                }

                input:focus {
                    border-color: #20d76b;
                    background: #12151a;
                    box-shadow:
                        0 0 0 3px rgba(32,215,107,0.10),
                        0 8px 25px rgba(0,0,0,0.2);
                }

                button {
                    width: 100%;
                    height: 52px;
                    margin-top: 14px;
                    border: 0;
                    border-radius: 13px;
                    background: linear-gradient(
                        135deg,
                        #20d76b,
                        #0eb85a
                    );
                    color: #06130b;
                    font-family: inherit;
                    font-size: 14px;
                    font-weight: 800;
                    letter-spacing: 0.5px;
                    cursor: pointer;
                    box-shadow:
                        0 10px 25px rgba(32,215,107,0.18),
                        inset 0 1px 0 rgba(255,255,255,0.25);
                    transition:
                        transform 0.15s ease,
                        filter 0.15s ease;
                    -webkit-appearance: none;
                    appearance: none;
                }

                button:active {
                    transform: scale(0.98);
                    filter: brightness(0.92);
                }

                .features {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 8px;
                }

                .feature {
                    min-width: 0;
                    padding: 12px 6px;
                    border-radius: 12px;
                    background: rgba(255,255,255,0.025);
                    border: 1px solid rgba(255,255,255,0.05);
                }

                .feature-icon {
                    font-size: 17px;
                    margin-bottom: 6px;
                }

                .feature-title {
                    color: #d8dbe1;
                    font-size: 10px;
                    font-weight: 700;
                    line-height: 1.3;
                }

                .feature-text {
                    color: #777d89;
                    font-size: 9px;
                    margin-top: 3px;
                }

                .copyright {
                    margin-top: 22px;
                    color: #555a65;
                    font-size: 10px;
                    line-height: 1.7;
                }

                @media (max-width: 380px) {
                    body {
                        padding: 16px 12px;
                    }

                    .box {
                        padding: 25px 18px 20px;
                        border-radius: 20px;
                    }

                    .logo {
                        width: 68px;
                        height: 68px;
                        font-size: 34px;
                    }

                    h1 {
                        font-size: 22px;
                    }

                    .features {
                        gap: 5px;
                    }

                    .feature {
                        padding: 10px 4px;
                    }
                }

                @media (min-width: 600px) {
                    .box {
                        padding: 38px 34px 30px;
                    }
                }
            </style>
        </head>

        <body>

            <main class="container">

                <section class="box">

                    <div class="logo">🎬</div>

                    <h1>FAPHOUSE PLAYER</h1>

                    <p class="subtitle">
                        Premium License Manager
                    </p>

                    <p class="brand">
                        Powered by <b>LAPAK ANGKER</b>
                    </p>

                    <div class="divider"></div>

                    <div class="error">
                        <span>❌</span>
                        <span>License key yang kamu masukkan tidak valid.</span>
                    </div>

                    <form method="POST">

                        <label class="label">
                            🔑 License Key
                        </label>

                        <div class="input-wrapper">
                            <span class="input-icon">🔐</span>

                            <input
                                type="text"
                                name="license"
                                placeholder="FAPHOUSE-XXXXX-XXXXX"
                                autocomplete="off"
                                autocapitalize="characters"
                                spellcheck="false"
                                required
                            >
                        </div>

                        <button type="submit">
                            ⚡ AKTIVASI LICENSE
                        </button>

                    </form>

                    <div class="divider"></div>

                    <div class="features">

                        <div class="feature">
                            <div class="feature-icon">🛡️</div>
                            <div class="feature-title">SECURE</div>
                            <div class="feature-text">Protected</div>
                        </div>

                        <div class="feature">
                            <div class="feature-icon">⚡</div>
                            <div class="feature-title">FAST</div>
                            <div class="feature-text">Verification</div>
                        </div>

                        <div class="feature">
                            <div class="feature-icon">📦</div>
                            <div class="feature-title">VERSION</div>
                            <div class="feature-text">1.0.0</div>
                        </div>

                    </div>

                    <div class="copyright">
                        © 2026 LAPAK ANGKER<br>
                        All Rights Reserved
                    </div>

                </section>

            </main>

        </body>
        </html>
