<!DOCTYPE html>

    <html lang="id">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >

        <title>Admin Dashboard - Lapak Angker</title>

        <style>

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            body {

                margin: 0;

                min-height: 100vh;
                min-height: 100dvh;

                background: #08090d;

                color: white;

                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Arial,
                    sans-serif;

                padding: 20px 16px;
            }


            .page {

                width: 100%;

                max-width: 700px;

                margin: auto;
            }


            .header {

                display: flex;

                align-items: center;

                justify-content: space-between;

                margin-bottom: 16px;
            }


            .brand {

                display: flex;

                align-items: center;

                gap: 11px;
            }


            .brand-icon {

                width: 45px;
                height: 45px;

                display: flex;

                align-items: center;

                justify-content: center;

                border-radius: 13px;

                background:
                    linear-gradient(
                        145deg,
                        #1ed760,
                        #0aa85a
                    );

                font-size: 21px;
            }


            .brand-title {

                font-size: 15px;

                font-weight: 800;
            }


            .brand-subtitle {

                margin-top: 3px;

                color: #666c78;

                font-size: 10px;
            }


            .logout {

                padding: 9px 12px;

                border-radius: 10px;

                border:
                    1px solid rgba(255,80,80,0.18);

                background:
                    rgba(255,70,70,0.08);

                color: #ff7777;

                text-decoration: none;

                font-size: 10px;

                font-weight: 800;
            }


            .hero {

                padding: 24px 20px;

                border-radius: 20px;

                background:
                    rgba(22,24,31,0.94);

                border:
                    1px solid rgba(255,255,255,0.08);

                box-shadow:
                    0 20px 55px rgba(0,0,0,0.45),
                    inset 0 1px 0 rgba(255,255,255,0.04);

                margin-bottom: 12px;
            }


            .hero h1 {

                margin: 0;

                font-size: 23px;

                letter-spacing: 0.8px;
            }


            .hero p {

                margin: 8px 0 0;

                color: #858b97;

                font-size: 12px;
            }


            .cards {

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

                margin-bottom: 12px;
            }


            .card {

                padding: 17px;

                border-radius: 15px;

                background:
                    rgba(22,24,31,0.94);

                border:
                    1px solid rgba(255,255,255,0.07);
            }


            .card-icon {

                font-size: 20px;

                margin-bottom: 9px;
            }


            .card-label {

                color: #666c78;

                font-size: 10px;
            }


            .card-value {

                margin-top: 5px;

                font-size: 20px;

                font-weight: 800;

                color: #45e58a;
            }


            .manager {

                padding: 20px;

                border-radius: 18px;

                background:
                    rgba(22,24,31,0.94);

                border:
                    1px solid rgba(255,255,255,0.07);
            }


            .manager-title {

                display: flex;

                align-items: center;

                gap: 9px;

                color: #dfe2e8;

                font-size: 14px;

                font-weight: 800;
            }


            .manager-description {

                margin-top: 7px;

                color: #666c78;

                font-size: 11px;

                line-height: 1.6;
            }


            .coming {

                margin-top: 17px;

                padding: 16px;

                border-radius: 13px;

                background:
                    rgba(32,215,107,0.04);

                border:
                    1px dashed rgba(32,215,107,0.16);

                text-align: center;

                color: #686e7a;

                font-size: 11px;

                line-height: 1.7;
            }


            .coming strong {

                display: block;

                color: #45e58a;

                margin-bottom: 4px;
            }


            .footer {

                text-align: center;

                margin-top: 18px;

                color: #4f545e;

                font-size: 9px;

                line-height: 1.6;
            }


            @media (max-width: 380px) {

                body {
                    padding: 16px 12px;
                }

                .hero {
                    padding: 21px 17px;
                }

                .cards {
                    gap: 7px;
                }

                .card {
                    padding: 14px;
                }

            }

            .label{

    display:block;

    margin-top:15px;

    margin-bottom:7px;

    font-size:12px;

    color:#dfe2e8;

    font-weight:700;

}

input,
select{

    width:100%;

    height:45px;

    border-radius:10px;

    border:1px solid #343842;

    background:#101217;

    color:white;

    padding:0 12px;

    font-size:14px;

}

button{

    width:100%;

    height:48px;

    margin-top:18px;

    border:none;

    border-radius:12px;

    background:#20d76b;

    color:#08110b;

    font-weight:800;

    cursor:pointer;

}

#result{

    margin-top:18px;

    text-align:center;

}
            .device-box {
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: #08090d;
    border: 1px solid #2d333d;
}

.device-title {
    color: #45e58a;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 10px;
}

.device-item {
    padding: 12px;
    border-radius: 10px;
    background: #101217;
    border: 1px solid #252a33;
    margin-top: 8px;
}

.device-platform {
    font-size: 13px;
    font-weight: 800;
    color: #fff;
}

.device-info {
    margin-top: 7px;
    font-size: 10px;
    line-height: 1.7;
    color: #777e8b;
    word-break: break-all;
}

.device-id {
    color: #45e58a;
}

.reset-device-btn {
    width: 100%;
    height: 42px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,80,80,0.25);
    background: #7f1d1d;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
}

.loading-device {
    margin-top: 10px;
    color: #686e7a;
    font-size: 11px;
    text-align: center;
}

        </style>

    </head>


    <body>

        <main class="page">


            <header class="header">

                <div class="brand">

                    <div class="brand-icon">
                        🎛️
                    </div>

                    <div>

                        <div class="brand-title">
                            LAPAK ANGKER
                        </div>

                        <div class="brand-subtitle">
                            Administrator Control
                        </div>

                    </div>

                </div>


                <a
                    href="/admin/logout"
                    class="logout"
                >
                    🚪 Logout
                </a>

            </header>


            <section class="hero">

                <h1>
                    License Dashboard
                </h1>

                <p>
                    Kelola license Faphouse Player dari satu tempat.
                </p>

            </section>


            <section class="cards">

                <div class="card">

                    <div class="card-icon">
                        🔑
                    </div>

                    <div class="card-label">
                        TOTAL LICENSE
                    </div>

                    <div
    class="card-value"
    id="totalLicense"
>
    0
</div>

                </div>


                <div class="card">

                    <div class="card-icon">
                        🟢
                    </div>

                    <div class="card-label">
                        ACTIVE LICENSE
                    </div>

                    <div
    class="card-value"
    id="activeLicense"
>
    0
</div>

                </div>

            </section>


            <section class="manager">

                <div class="manager-title">
                    🔐 License Manager
                </div>

                <form id="licenseForm">

    <label class="label">
        Nama Pembeli
    </label>

    <input
        type="text"
        id="name"
        placeholder="Nama Pembeli"
    >

    <label class="label">
        Durasi
    </label>

    <select id="duration_days">

        <option value="7">7 Hari</option>

        <option value="30" selected>30 Hari</option>

        <option value="90">90 Hari</option>

        <option value="365">365 Hari</option>

    </select>


    <label class="label">
        Max Device
    </label>

    <select id="max_devices">

        <option value="1">1 Device</option>

        <option value="2">2 Device</option>

        <option value="3">3 Device</option>

        <option value="5">5 Device</option>

    </select>


    <label class="label">
        Catatan
    </label>

    <input
        type="text"
        id="notes"
        placeholder="Opsional"
    >

    <button
        type="button"
        id="generateBtn"
    >
        🚀 Generate License
    </button>

</form>


<div id="result"></div>

<hr style="margin:25px 0;border:none;border-top:1px solid #2c313a;">

<h3 style="margin-bottom:15px;">
📋 Daftar License
</h3>

<div id="licenseList">

    Memuat data...

</div>

            </section>


            <div class="footer">

                © 2026 LAPAK ANGKER<br>

                Administrator Panel

            </div>


        </main>

        <script>

document
.getElementById("generateBtn")
.addEventListener("click", async function(){

    const response = await fetch(
        "/admin/generate-license",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                name:
                    document.getElementById("name").value,

                duration_days:
                    document.getElementById("duration_days").value,

                max_devices:
                    document.getElementById("max_devices").value,

                notes:
                    document.getElementById("notes").value

            })

        }
    );

    const data = await response.json();

    if(data.success){

        document.getElementById("result").innerHTML=`

            <div style="
                margin-top:18px;
                padding:15px;
                border-radius:12px;
                background:#102417;
                border:1px solid #20d76b;
            ">

                <div style="color:#45e58a;font-weight:700;">
                    ✅ License Berhasil Dibuat
                </div>

                <div
                    id="newLicense"
                    style="
                        margin-top:10px;
                        font-size:18px;
                        font-weight:800;
                        word-break:break-all;
                    "
                >
                    ${data.license_key}
                </div>

                <button
                    onclick="copyLicense()"
                    style="margin-top:15px;"
                >
                    📋 Copy License
                </button>

            </div>

        `;

    }else{

        alert(data.message);

    }

});

function copyLicense(){

    navigator.clipboard.writeText(

        document
        .getElementById("newLicense")
        .innerText

    );

    alert("License berhasil disalin");

}

async function loadLicenses(){

    const response = await fetch("/admin/licenses");

    const data = await response.json();

    if(!data.success){
        return;
    }


    document.getElementById("totalLicense").innerText =
        data.total;


    document.getElementById("activeLicense").innerText =
        data.active;


    let html = "";


    data.licenses.forEach(item => {

        html += `

<div style="
    background:#101217;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    border:1px solid #2d333d;
">

    <div style="
        color:#45e58a;
        font-weight:bold;
        word-break:break-all;
    ">
        ${item.license_key}
    </div>

    <div style="margin-top:8px;font-size:13px;">
        👤 ${item.name}
    </div>

    <div style="margin-top:4px;font-size:13px;">
        📅 ${item.duration_days} Hari
    </div>

    <div style="margin-top:4px;font-size:13px;">
        📱 ${item.max_devices} Device
    </div>

    <div style="
        margin-top:8px;
        font-size:13px;
        font-weight:700;
    ">
        Status:
        <span style="
            color:${item.status === "active" ? "#45e58a" : "#ff7777"};
        ">
            ${item.status === "active" ? "🟢 ACTIVE" : "🔴 INACTIVE"}
        </span>
    </div>

    <button
        type="button"
        onclick="toggleLicense(
            '${item.id}',
            '${item.status}'
        )"
        style="
            margin-top:12px;
            background:${item.status === "active" ? "#ff5555" : "#20d76b"};
        "
    >
        ${item.status === "active"
            ? "🔴 Nonaktifkan"
            : "🟢 Aktifkan"
        }
    </button>

    <button
        type="button"
        onclick="loadDevices('${item.id}', this)"
        style="
            margin-top:8px;
            background:#164e63;
            color:#fff;
        "
    >
        📱 Lihat Device
    </button>


    <div
        id="devices-${item.id}"
        style="display:none;"
    ></div>

        <button
        type="button"
        onclick="deleteLicense('${item.id}')"
        style="
            margin-top:8px;
            background:#7f1d1d;
            color:#fff;
        "
    >
        🗑️ Hapus License
    </button>

</div>

`;

    });


    document.getElementById("licenseList").innerHTML = html;

}

loadLicenses();

async function toggleLicense(id, currentStatus){

    const newStatus =
        currentStatus === "active"
            ? "inactive"
            : "active";


    const action =
        newStatus === "active"
            ? "mengaktifkan"
            : "menonaktifkan";


    const confirmed = confirm(
        `Yakin ingin ${action} license ini?`
    );


    if(!confirmed){
        return;
    }


    try{

        const response = await fetch(
            "/admin/update-license",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    id: id,

                    status: newStatus

                })

            }
        );


        const data = await response.json();


        if(data.success){

            alert(data.message);

            loadLicenses();

        }else{

            alert(
                data.message ||
                "Gagal mengubah status license"
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan saat menghubungi server"
        );

    }

}

async function deleteLicense(id){

    const confirmed = confirm(
        "Yakin ingin menghapus license ini?\n\n" +
        "License yang sudah dihapus tidak dapat digunakan lagi."
    );

    if(!confirmed){
        return;
    }

    try{

        const response = await fetch(
            "/admin/delete-license",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    id: id
                })
            }
        );

        const data = await response.json();

        if(data.success){

            alert(data.message);

            loadLicenses();

        }else{

            alert(
                data.message ||
                "Gagal menghapus license"
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan saat menghubungi server"
        );

    }

}

async function loadDevices(licenseId, button){

    const container =
        document.getElementById(
            "devices-" + licenseId
        );

    if(!container){
        return;
    }


    // Jika sedang terbuka → tutup
    if(container.style.display === "block"){

        container.style.display = "none";

        button.innerText = "📱 Lihat Device";

        return;
    }


    container.style.display = "block";

    container.innerHTML = `
        <div class="device-box">
            <div class="loading-device">
                ⏳ Memuat device...
            </div>
        </div>
    `;


    try{

        const response = await fetch(
            "/admin/license-devices/" + licenseId
        );


        const data = await response.json();


        if(!data.success){

            container.innerHTML = `
                <div class="device-box">
                    <div style="
                        color:#ff7777;
                        font-size:11px;
                        text-align:center;
                    ">
                        ❌ Gagal mengambil data device
                    </div>
                </div>
            `;

            return;
        }


        const devices = data.devices || [];


        if(devices.length === 0){

            container.innerHTML = `
                <div class="device-box">

                    <div class="device-title">
                        📱 DEVICE TERDAFTAR
                    </div>

                    <div style="
                        color:#686e7a;
                        font-size:11px;
                        text-align:center;
                        padding:10px 0;
                    ">
                        Tidak ada device terdaftar.
                    </div>

                </div>
            `;

            button.innerText = "📱 Sembunyikan Device";

            return;
        }


        let html = `

            <div class="device-box">

                <div class="device-title">
                    📱 DEVICE TERDAFTAR
                </div>

        `;


        devices.forEach(device => {

            const firstSeen =
                device.first_seen
                    ? new Date(
                        device.first_seen
                    ).toLocaleString("id-ID")
                    : "-";


            const lastSeen =
                device.last_seen
                    ? new Date(
                        device.last_seen
                    ).toLocaleString("id-ID")
                    : "-";


            html += `

                <div class="device-item">

                    <div class="device-platform">
                        💻 ${device.platform || "Unknown"}
                    </div>


                    <div class="device-info">

                        <div>
                            🆔 Device ID:
                        </div>

                        <div class="device-id">
                            ${device.device_id}
                        </div>


                        <div style="margin-top:6px;">
                            🕐 First Seen:
                            ${firstSeen}
                        </div>


                        <div>
                            🟢 Last Seen:
                            ${lastSeen}
                        </div>

                    </div>


                    <button
                        type="button"
                        class="reset-device-btn"
                        onclick="resetDevice(
                            '${device.id}',
                            '${licenseId}'
                        )"
                    >
                        🔓 RESET DEVICE
                    </button>

                </div>

            `;

        });


        html += `

            </div>

        `;


        container.innerHTML = html;

        button.innerText =
            "📱 Sembunyikan Device";


    }catch(error){

        console.error(error);


        container.innerHTML = `
            <div class="device-box">

                <div style="
                    color:#ff7777;
                    font-size:11px;
                    text-align:center;
                ">
                    ❌ Terjadi kesalahan saat
                    menghubungi server.
                </div>

            </div>
        `;

    }

}

async function resetDevice(deviceId, licenseId){

    const confirmed = confirm(
        "Yakin ingin mereset device ini?\n\n" +
        "Device akan dihapus dari license dan " +
        "slot device akan tersedia kembali."
    );


    if(!confirmed){
        return;
    }


    try{

        const response = await fetch(
            "/admin/reset-device",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    device_id: deviceId

                })

            }
        );


        const data = await response.json();


        if(data.success){

            alert(
                "✅ Device berhasil direset."
            );


            // Refresh daftar device
            const button =
                document.querySelector(
                    `[onclick="loadDevices('${licenseId}', this)"]`
                );


            if(button){

                // Paksa tutup lalu buka kembali
                const container =
                    document.getElementById(
                        "devices-" + licenseId
                    );

                if(container){

                    container.style.display = "none";

                }

                button.innerText =
                    "📱 Lihat Device";


                loadDevices(
                    licenseId,
                    button
                );

            }

        }else{

            alert(
                data.message ||
                "❌ Gagal mereset device."
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "❌ Terjadi kesalahan saat " +
            "menghubungi server."
        );

    }

}

</script>

    </body>

    </html>
